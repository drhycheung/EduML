/* Type stack: prefer Hong Kong / CJK faces, then fall back to the platform UI
   font. Latin glyphs still come from the same family, so the page stays
   visually consistent across macOS, Windows and Linux. */
body {
  font-family: "Inter", "Helvetica Neue", "Segoe UI", system-ui,
               -apple-system, "PingFang HK", "Microsoft JhengHei", sans-serif;
}

/* Readouts that update on every slider tick. Tabular figures stop the digits
   from jittering horizontally as the value changes. */
.num { font-variant-numeric: tabular-nums; }

/* Hide the default disclosure triangle; we draw our own caret instead. */
details > summary { cursor: pointer; list-style: none; }
details > summary::-webkit-details-marker { display: none; }

.caret { transition: transform .15s; display: inline-block; }
details[open] .caret { transform: rotate(90deg); }

/* Colour the native range thumb/track to match the palette. */
input[type=range] { accent-color: #2563eb; }
